name: Bug Report
description: Report a CAD export error, geometric collision flaw, or UI glitch in SwitchRig Studio
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help reproduce and resolve the problem.
  - type: input
    id: studio_url
    attributes:
      label: Web Application Version
      description: Visible in the top navigation bar (e.g. v0.5.0), or leave blank if unsure.
      placeholder: e.g. v0.5.0
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Web Browser
      description: Which browser are you using to access switchrigapp.com?
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Microsoft Edge
        - Brave
        - Other (specify in description)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10
        - macOS
        - Linux (Ubuntu, Debian, Fedora, Arch)
        - iPadOS / iOS
        - Android
    validations:
      required: true
  - type: dropdown
    id: process_preset
    attributes:
      label: Manufacturing Process / Machine
      options:
        - Laser Cutter (CO2 / Diode)
        - CNC Router / Milling Machine
        - 3D Printer (FDM / Resin)
        - Faceplate Only (Flat Sheet)
    validations:
      required: false
  - type: dropdown
    id: export_format
    attributes:
      label: Affected CAD Export (if applicable)
      options:
        - 1:1 DXF (LightBurn / Fusion 360 / FreeCAD)
        - SVG (Laser Cut Vector)
        - STEP (3D Solid CAD)
        - STL (3D Printing Mesh)
        - Hardware BOM (Bill of Materials)
        - 2D Canvas / 3D WebGL Viewport
        - Not an export issue
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of what went wrong.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps needed to reproduce this issue.
      placeholder: |
        1. Open SwitchRig Studio
        2. Select machine '...'
        3. Place component '...'
        4. Observe unexpected collision / export result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: The joint tabs should align flush against the wall...
    validations:
      required: true
  - type: textarea
    id: additional_info
    attributes:
      label: Additional Context & Screenshots
      description: Paste any error messages from the browser developer console (F12) or drag-and-drop screenshots.
